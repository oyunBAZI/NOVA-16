name: NOVA-16 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        mode: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/setup_zig.py
      - run: zig build fmt
      - run: zig build -Doptimize=${{ matrix.mode }} -Dstrip=${{ matrix.mode == 'ReleaseSafe' }} -Dcpu=baseline
      - run: zig build test -Doptimize=${{ matrix.mode }}
      - run: python scripts/acceptance.py
      - if: matrix.mode == 'ReleaseSafe'
        run: python scripts/package.py
      - if: matrix.mode == 'ReleaseSafe'
        shell: bash
        run: for package in dist/*.zip; do python scripts/verify_package.py "$package"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.mode == 'ReleaseSafe'
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/setup_zig.py
      - run: python3 scripts/cross_acceptance.py
  sdl2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/setup_zig.py
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb xauth
      - if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "NOVA_SDL_PREFIX=$(brew --prefix sdl2)" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sdl2:x64-windows
          echo "NOVA_SDL_PREFIX=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
      - if: runner.os == 'Linux'
        run: |
          zig build -Dgui=true
          xvfb-run -a zig build gui-test -Dgui=true
      - if: runner.os == 'macOS'
        run: |
          zig build -Dgui=true --search-prefix "$NOVA_SDL_PREFIX"
          zig build gui-test -Dgui=true --search-prefix "$NOVA_SDL_PREFIX"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          zig build -Dgui=true --search-prefix "$env:NOVA_SDL_PREFIX"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build gui-test -Dgui=true --search-prefix "$env:NOVA_SDL_PREFIX"
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/setup_zig.py
      - run: python3 scripts/benchmark.py --out zig-out/benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-baseline
          path: zig-out/benchmark.json
  reliability:
    uses: ./.github/workflows/fuzz.yml
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/security_check.py
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release:')
    needs: [native, cross, sdl2, benchmark, reliability, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Publish tested prerelease and immutable source target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import re; print(re.search(r"\.version\s*=\s*\"([^\"]+)\"", open("build.zig.zon").read()).group(1))')
          gh release create "v$version" --target "$GITHUB_SHA" --prerelease --title "NOVA-16 $version" --notes-file CHANGELOG.md release-assets/*

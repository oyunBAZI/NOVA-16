name: NOVA-16 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        mode: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/setup_zig.py
      - run: zig build fmt
      - run: zig build -Doptimize=${{ matrix.mode }} -Dstrip=${{ matrix.mode == 'ReleaseSafe' }} -Dcpu=baseline
      - run: zig build test -Doptimize=${{ matrix.mode }}
      - run: zig build v2-model-test -Doptimize=${{ matrix.mode }}
      - run: python scripts/acceptance.py
      - run: python scripts/compatibility_acceptance.py
      - run: python scripts/developer_acceptance.py
      - run: python scripts/compiler_acceptance.py
      - run: python scripts/project_acceptance.py
      - run: python scripts/application_acceptance.py
      - run: python scripts/v2_contract_vectors.py
      - run: python scripts/v2_acceptance.py
      - run: python scripts/game_acceptance.py
      - if: matrix.mode == 'ReleaseSafe'
        run: python scripts/package.py
      - if: matrix.mode == 'ReleaseSafe'
        run: python scripts/package_reproducibility.py
      - if: matrix.mode == 'ReleaseSafe'
        shell: bash
        run: for package in dist/*.zip; do python scripts/verify_package.py "$package"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.mode == 'ReleaseSafe'
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/setup_zig.py
      - run: python3 scripts/cross_acceptance.py
  sdl2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/setup_zig.py
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb xauth
      - if: runner.os == 'macOS'
        run: python scripts/setup_sdl.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sdl2:x64-windows
          echo "NOVA_SDL_PREFIX=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
      - if: runner.os == 'Linux'
        run: |
          zig build -Dgui=true
          xvfb-run -a zig build gui-test -Dgui=true
      - if: runner.os == 'macOS'
        run: |
          zig build -Dgui=true --search-prefix "$NOVA_SDL_PREFIX"
          zig build gui-test -Dgui=true --search-prefix "$NOVA_SDL_PREFIX"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          zig build -Dgui=true --search-prefix "$env:NOVA_SDL_PREFIX"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build gui-test -Dgui=true --search-prefix "$env:NOVA_SDL_PREFIX"
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/setup_zig.py
      - run: python3 scripts/benchmark.py --out zig-out/benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-baseline
          path: zig-out/benchmark.json
  reliability:
    uses: ./.github/workflows/fuzz.yml
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/security_check.py
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release:')
    needs: [native, cross, sdl2, benchmark, reliability, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Attest tested release archives
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*.zip
          create-storage-record: false
      - name: Verify provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" release-assets/provenance.sigstore.json
          for package in release-assets/*.zip; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE"
          done
      - name: Publish tested prerelease and immutable source target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import re; print(re.search(r"\.version\s*=\s*\"([^\"]+)\"", open("build.zig.zon").read()).group(1))')
          cp CHANGELOG.md "$RUNNER_TEMP/release-notes.md"
          printf '\nVerification: https://github.com/%s/actions/runs/%s\nSource revision: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --prerelease --title "NOVA-16 $version" --notes-file "$RUNNER_TEMP/release-notes.md" release-assets/*

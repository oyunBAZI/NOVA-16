name: NOVA-16 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        mode: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/setup_zig.py
      - run: zig build fmt
      - run: zig build -Doptimize=${{ matrix.mode }}
      - run: zig build test -Doptimize=${{ matrix.mode }}
      - run: python scripts/acceptance.py
  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup_zig.py
      - run: python3 scripts/cross_acceptance.py
  sdl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup_zig.py
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb xauth
      - run: zig build -Dgui=true
      - run: zig build test -Dgui=true
      - run: xvfb-run -a zig-out/bin/nova16 run zig-out/demos/paint.n16 --gui --frames 6

name: Fuzz and coverage
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 1'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup_zig.py
      - name: Coverage-guided fuzzing
        run: zig build test -Doptimize=ReleaseSafe --fuzz=${{ github.event_name == 'schedule' && '100K' || '1K' }} --test-timeout 10m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus
          include-hidden-files: true
          path: .zig-cache/f/
          if-no-files-found: warn
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup_zig.py
      - name: Build pinned kcov v43 (not packaged by this runner image)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev libdw-dev libelf-dev libssl-dev libiberty-dev binutils-dev zlib1g-dev
          git init "$RUNNER_TEMP/kcov"
          git -C "$RUNNER_TEMP/kcov" remote add origin https://github.com/SimonKagstrom/kcov.git
          git -C "$RUNNER_TEMP/kcov" fetch --depth 1 origin a39874f938ce13f7a65f253120d1ec946b349ffe
          git -C "$RUNNER_TEMP/kcov" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/kcov" tag v43 a39874f938ce13f7a65f253120d1ec946b349ffe
          cmake -S "$RUNNER_TEMP/kcov" -B "$RUNNER_TEMP/kcov-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/kcov-install"
          cmake --build "$RUNNER_TEMP/kcov-build" --parallel 2
          cmake --install "$RUNNER_TEMP/kcov-build"
          echo "$RUNNER_TEMP/kcov-install/bin" >> "$GITHUB_PATH"
      - name: Build standalone tests with debug information
        run: zig test -fllvm --test-no-exec --dep examples -Mroot=src/root.zig -Mexamples=examples/sources.zig -femit-bin=nova16-tests
      - name: Measure source coverage
        run: kcov --include-path=${{ github.workspace }}/src coverage ./nova16-tests
      - uses: actions/upload-artifact@v4
        with:
          name: source-coverage
          path: coverage/
